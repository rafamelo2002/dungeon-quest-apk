name: Compilar APK Android (Dungeon_Quest)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout do Código
      uses: actions/checkout@v4

    - name: 2. Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 3. Configurar Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 4. Aceitar Licenças do Android SDK
      run: |
        yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

    - name: 5. Garantir Permissões de Execução
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        fi

    - name: 6. Compilar APK com Gradle
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug --stacktrace --no-daemon
        else
          gradle assembleDebug --stacktrace --no-daemon
        fi

    - name: 7. Renomear APK de saída
      run: |
        mkdir -p dist-apk
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/Dungeon_Quest-debug.apk
        else
          find app/build -name "*.apk" -exec cp {} dist-apk/Dungeon_Quest-debug.apk \;
        fi

    - name: 8. Fazer Upload do Arquivo APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: Dungeon_Quest-Android-APK
        path: dist-apk/Dungeon_Quest-debug.apk
        retention-days: 30

    - name: 9. Criar Release com Link Direto do APK
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        files: dist-apk/Dungeon_Quest-debug.apk
        tag_name: v1.0.0-build${{ github.run_number }}
        name: "Dungeon Quest v1.0.0 (.APK)"
        body: |
          ### 🎉 Seu APK Android foi compilado com sucesso!
          - **Aplicativo:** Dungeon Quest
          - **Pacote:** `com.aistudio.dungeonquest`
          - **Versão:** 1.0.0
          - **URL Alvo:** https://ais-pre-dungeonquest-589460615465.us-east1.run.app
          
          Baixe o arquivo `Dungeon_Quest-debug.apk` abaixo e instale diretamente no seu aparelho Android.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
